services:
  postgres:
    image: docker.arvancloud.ir/postgres:16
    container_name: unixsee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: unixsee
      POSTGRES_USER: unixsee
      POSTGRES_PASSWORD: unixsee
    ports:
      - '5432:5432'
    volumes:
      - ./docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U unixsee -d unixsee']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unixsee-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://unixsee:unixsee@postgres:5432/unixsee?schema=public
      JWT_ACCESS_SECRET: change-me-access-secret-at-least-32-chars
      JWT_REFRESH_SECRET: change-me-refresh-secret-at-least-32-chars
      JWT_MONITORING_ACCESS_SECRET: change-me-monitoring-secret-at-least-32-chars
      JWT_ACCESS_TOKEN_EXPIRATION: 3600
      JWT_REFRESH_TOKEN_EXPIRATION: 604800
      JWT_MONITORING_ACCESS_TOKEN_EXPIRATION: 300
      OTP_EXPIRED_TIME_KEY: 300
      OTP_RETRY_TIME: 60
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:4000
    ports:
      - '4000:4000'
